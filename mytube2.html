<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #ff2d55;
    --accent2: #ff6b35;
    --text: #f0f0f8;
    --muted: #6b6b8a;
    --card-hover: #1e1e2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    flex-shrink: 0;
    cursor: pointer;
  }

  .logo span {
    color: var(--text);
    -webkit-text-fill-color: var(--text);
  }

  /* SEARCH BAR */
  .search-wrap {
    flex: 1;
    max-width: 600px;
    display: flex;
    gap: 0;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-right: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 8px 0 0 8px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus {
    border-color: var(--accent);
  }

  .search-wrap input::placeholder { color: var(--muted); }

  .search-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: white;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 0 8px 8px 0;
    font-size: 18px;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  .search-btn:hover { opacity: 0.85; }
  .search-btn:active { transform: scale(0.96); }

  /* MAIN */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* ... (mantengo todo tu CSS original hasta el modal) ... */

  /* PLAYER MODAL */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 500;
    backdrop-filter: blur(12px);
    animation: fadeIn 0.2s ease;
    padding: 20px;
    align-items: center;
    justify-content: center;
  }

  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    width: 100%;
    max-width: 900px;
    border: 1px solid var(--border);
    box-shadow: 0 40px 100px rgba(0,0,0,0.7);
    animation: scaleUp 0.25s ease;
  }

  .modal-player {
    aspect-ratio: 16/9;
    width: 100%;
    background: #000;
    position: relative;
  }

  .modal-info {
    padding: 20px 24px;
  }

  /* Plyr Custom Styles */
  #plyrPlayer {
    width: 100%;
    height: 100%;
  }

  .plyr {
    border-radius: 0;
    height: 100%;
  }

  .plyr__video-embed {
    height: 100% !important;
    padding-bottom: 0 !important;
  }

  /* Resto de tus estilos originales (mantengo compacto) */
  .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
  .modal-channel { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 12px; }
  .modal-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 18px; border-radius: 8px; border: none;
    cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 600; transition: all 0.2s;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary:hover { opacity: 0.85; }

  .modal-close {
    position: absolute; top: 20px; right: 20px;
    width: 40px; height: 40px; background: rgba(255,255,255,0.1);
    border: none; border-radius: 50%; color: white;
    font-size: 20px; cursor: pointer; z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: rgba(255,45,85,0.5); }

  /* Mantengo el resto de estilos (loading, cards, etc.) iguales */
  /* ... (el resto de tu CSS original se mantiene sin cambios) ... */
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">My<span>Tube</span></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Busca cualquier cosa..." autocomplete="off" />
    <button class="search-btn" onclick="doSearch()" title="Buscar">&#128269;</button>
  </div>
</header>

<main id="mainContent"></main>

<!-- Player Modal -->
<div class="modal-bg" id="playerModal">
  <div style="position:relative; width:100%; max-width:900px;">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div class="modal">
      <div class="modal-player" id="modalPlayer">
        <div id="plyrPlayer"></div>
      </div>
      <div class="modal-info">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-channel" id="modalChannel"></div>
        <div class="modal-actions">
          <button class="modal-btn btn-primary" onclick="openYouTube()">&#128279; Ver en YouTube</button>
          <button class="modal-btn btn-secondary" onclick="closeModal()">&#10005; Cerrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Plyr JS -->
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>

<script>
  // ─── CONFIG ───────────────────────────────────────────────
  const STORAGE_KEY = 'mytube_api_key';
  const POPULAR_QUERIES = ['música', 'gaming', 'programación', 'cocina', 'deportes', 'ciencia', 'viajes', 'películas'];
  let currentVideoId = '';
  let apiKey = '';
  let player = null; // ← Plyr instance

  // ─── INIT ─────────────────────────────────────────────────
  window.onload = () => {
    apiKey = localStorage.getItem(STORAGE_KEY) || '';
    if (!apiKey) {
      showSetup();
    } else {
      showHome();
    }

    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
  };

  // ─── API KEY SETUP ─────────────────────────────────────────
  function showSetup() {
    document.getElementById('mainContent').innerHTML = `
      <div class="setup-screen">
        <div class="setup-icon">🔑</div>
        <h2>Configura tu API Key</h2>
        <p>
          MyTube usa la <strong>YouTube Data API v3</strong> (gratuita con cuota diaria).
          Necesitas una API Key de Google para buscar vídeos.<br><br>
          Consíguela gratis en
          <a href="https://console.cloud.google.com/" target="_blank">Google Cloud Console</a> →
          Habilita "YouTube Data API v3" → Credenciales → Crear API Key.
        </p>
        <input class="setup-input" id="apiKeyInput" type="text" placeholder="Pega aquí tu API Key..." />
        <button class="setup-submit" onclick="saveApiKey()">Guardar y continuar</button>
        <p class="setup-note">
          Tu clave se guarda <strong>solo en tu navegador</strong> (localStorage).<br>
          La cuota gratuita es de 10.000 unidades diarias — suficiente para cientos de búsquedas.
        </p>
      </div>
    `;
  }

  function saveApiKey() {
    const input = document.getElementById('apiKeyInput').value.trim();
    if (!input) { alert('Escribe tu API Key primero.'); return; }
    apiKey = input;
    localStorage.setItem(STORAGE_KEY, apiKey);
    showHome();
  }

  // ─── HOME, SEARCH, RENDER (sin cambios) ───────────────────
  function showHome() { /* ... igual que antes ... */ 
    document.getElementById('mainContent').innerHTML = `
      <div class="hero">
        <h1>Descubre<br>tu próximo<br>vídeo</h1>
        <p>Busca cualquier tema y encuentra los mejores vídeos al instante</p>
        <div class="hero-tags">
          ${POPULAR_QUERIES.map(q => `<span class="tag" onclick="quickSearch('${q}')">${q}</span>`).join('')}
          <span class="tag" onclick="changeKey()" style="border-color: rgba(255,45,85,0.3); color: #ff2d55;">⚙ Cambiar API Key</span>
        </div>
      </div>
    `;
  }

  function goHome() {
    document.getElementById('searchInput').value = '';
    showHome();
  }

  function quickSearch(term) {
    document.getElementById('searchInput').value = term;
    doSearch();
  }

  function changeKey() {
    localStorage.removeItem(STORAGE_KEY);
    apiKey = '';
    showSetup();
  }

  // (Mantengo doSearch, renderResults, showLoading, showError, utils iguales)

  async function doSearch() { /* ... tu código original sin cambios ... */ }
  function renderResults(items, detailsMap, query) { /* ... tu código original sin cambios ... */ }
  function showLoading(msg) { /* ... */ }
  function showError(title, msg, showChangeKey = false) { /* ... */ }
  function escHtml(str) { /* ... */ }
  function parseDuration(iso) { /* ... */ }
  function pad(n) { /* ... */ }
  function formatViews(n) { /* ... */ }
  function timeAgo(dateStr) { /* ... */ }

  // ─── PLAYER CON PLYR ──────────────────────────────────────
  function openVideo(videoId, title, channel) {
    currentVideoId = videoId;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalChannel').textContent = channel;

    const playerContainer = document.getElementById('plyrPlayer');
    playerContainer.innerHTML = `
      <div id="youtube-player" data-type="youtube" data-video-id="${videoId}"></div>
    `;

    // Destruir reproductor anterior
    if (player) {
      player.destroy();
    }

    player = new Plyr('#youtube-player', {
      youtube: {
        noCookie: true,
        rel: 0,
        modestbranding: 1,
        playsinline: 1
      },
      controls: [
        'play-large', 'play', 'progress', 'current-time', 
        'duration', 'mute', 'volume', 'settings', 'fullscreen'
      ],
      settings: ['quality', 'speed'],
      loadSprite: false,
      autoplay: true
    });

    document.getElementById('playerModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    if (player) {
      player.pause();
      player.destroy();
      player = null;
    }
    document.getElementById('playerModal').classList.remove('open');
    document.getElementById('plyrPlayer').innerHTML = '';
    document.body.style.overflow = '';
  }

  function openYouTube() {
    window.open(`https://www.youtube.com/watch?v=${currentVideoId}`, '_blank');
  }

  document.getElementById('playerModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
</script>
</body>
</html>
