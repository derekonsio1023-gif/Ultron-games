<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>

<!-- Plyr CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #ff2d55;
    --accent2: #ff6b35;
    --text: #f0f0f8;
    --muted: #6b6b8a;
    --card-hover: #1e1e2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10,10,15,0.92); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 64px;
    display: flex; align-items: center; gap: 32px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px; letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    cursor: pointer;
  }

  .search-wrap { flex: 1; max-width: 600px; display: flex; }
  .search-wrap input {
    width: 100%; background: var(--surface2); border: 1.5px solid var(--border);
    border-right: none; color: var(--text); padding: 10px 18px;
    border-radius: 8px 0 0 8px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: white; padding: 10px 20px; cursor: pointer;
    border-radius: 0 8px 8px 0;
  }

  main { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }

  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
  }

  .video-card {
    background: var(--surface); border-radius: 12px; overflow: hidden;
    cursor: pointer; transition: all 0.25s;
  }
  .video-card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.4); }

  .thumbnail-wrap { position: relative; aspect-ratio: 16/9; overflow: hidden; }
  .thumbnail-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
  .video-card:hover .thumbnail-wrap img { transform: scale(1.05); }

  .duration-badge {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(0,0,0,0.82); color: white; font-size: 12px;
    padding: 2px 7px; border-radius: 4px;
  }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
    z-index: 500; align-items: center; justify-content: center;
  }
  .modal-bg.open { display: flex; }

  .modal { background: var(--surface); border-radius: 16px; overflow: hidden; max-width: 900px; width: 100%; border: 1px solid var(--border); }
  .modal-player { aspect-ratio: 16/9; background: #000; position: relative; }
  #plyrPlayer { width: 100%; height: 100%; }

  .modal-info { padding: 20px 24px; }
  .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
  .modal-channel { font-size: 14px; color: var(--muted); margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 12px; }

  .modal-btn { padding: 9px 18px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: white; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  .modal-close {
    position: absolute; top: 20px; right: 20px; width: 40px; height: 40px;
    background: rgba(255,255,255,0.1); border: none; border-radius: 50%;
    color: white; font-size: 20px; cursor: pointer; z-index: 10;
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">My<span>Tube</span></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Busca cualquier cosa..." autocomplete="off" />
    <button class="search-btn" onclick="doSearch()">🔍</button>
  </div>
</header>

<main id="mainContent"></main>

<!-- Player Modal -->
<div class="modal-bg" id="playerModal">
  <div style="position:relative; width:100%; max-width:900px;">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal">
      <div class="modal-player">
        <div id="plyrPlayer"></div>
      </div>
      <div class="modal-info">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-channel" id="modalChannel"></div>
        <div class="modal-actions">
          <button class="modal-btn btn-primary" onclick="openYouTube()">Ver en YouTube</button>
          <button class="modal-btn btn-secondary" onclick="closeModal()">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>

<script>
  // ... (mantengo todo el código anterior: storage check, setup, search, etc.)

  let currentVideoId = '';
  let apiKey = '';
  let player = null;
  let storageAvailable = true;

  // (Mantengo las funciones showSandboxWarning, showSetup, showHome, doSearch, renderResults, etc. iguales)

  // ==================== REPRODUCTOR PLYR CORREGIDO ====================
  function openVideo(videoId, title, channel) {
    currentVideoId = videoId;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalChannel').textContent = channel;

    const container = document.getElementById('plyrPlayer');
    container.innerHTML = `
      <video id="player" playsinline controls>
        <source src="https://www.youtube.com/watch?v=${videoId}" type="video/youtube">
      </video>
    `;

    // Destruir reproductor anterior
    if (player) {
      player.destroy();
    }

    // Crear nuevo reproductor
    player = new Plyr('#player', {
      youtube: {
        noCookie: true,
        rel: 0,
        modestbranding: 1,
        playsinline: 1
      },
      controls: [
        'play-large', 'play', 'progress', 'current-time', 
        'duration', 'mute', 'volume', 'settings', 'fullscreen'
      ],
      settings: ['quality', 'speed'],
      autoplay: true,
      loadSprite: false
    });

    document.getElementById('playerModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    if (player) {
      player.pause();
      player.destroy();
      player = null;
    }
    document.getElementById('plyrPlayer').innerHTML = '';
    document.getElementById('playerModal').classList.remove('open');
    document.body.style.overflow = '';
  }

  function openYouTube() {
    window.open(`https://www.youtube.com/watch?v=${currentVideoId}`, '_blank');
  }

  // ==================== Resto de funciones (igual que antes) ====================
  window.onload = () => {
    storageAvailable = (() => { try { localStorage.setItem('test','test'); localStorage.removeItem('test'); return true; } catch(e) { return false; } })();

    if (!storageAvailable) {
      document.getElementById('mainContent').innerHTML = `<div style="max-width:600px;margin:100px auto;padding:40px;background:var(--surface);border-radius:16px;text-align:center;"><h2>⚠️ Abre con servidor local</h2><p>Ejecuta: <code>python3 -m http.server 8000</code></p></div>`;
      return;
    }

    apiKey = localStorage.getItem('mytube_api_key') || '';
    if (!apiKey) showSetup(); else showHome();

    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  };

  // (Incluye aquí todas las demás funciones: showSetup, saveApiKey, doSearch, renderResults, showLoading, showError, etc.)
  // Copia las funciones de la versión anterior que funcionaba bien.

</script>
</body>
</html>
