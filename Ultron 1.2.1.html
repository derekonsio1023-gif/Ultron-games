<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON 0.3 - Rainbow Edition</title>
    <style>
        :root { 
            --bg-color: #050508; 
            --card-bg: #0d0f16; 
            --border-color: #16192b; 
            --neon-blue: #00d2ff; 
            --neon-pink: #ff0055; 
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', sans-serif; color: white; 
            overflow-x: hidden; 
        }

        /* FONDO DINÁMICO DE ULTRON */
        #menu-view {
            position: relative;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease, filter 0.5s ease;
            filter: brightness(1) saturate(1);
        }

        /* Overlay para efecto de oscurecimiento */
        #menu-view::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 5, 8, 0.3);
            pointer-events: none;
            z-index: 1;
            transition: background-color 0.5s ease;
        }

        /* Contenido del menú por encima del overlay */
        #menu-view > * {
            position: relative;
            z-index: 2;
        }
        
        header { text-align: center; padding: 40px 20px; }
        h1 { 
            margin: 0; font-size: 3rem; font-weight: 900; letter-spacing: 5px; 
            color: var(--neon-blue); text-shadow: 0 0 20px rgba(0, 210, 255, 0.5); 
            text-transform: uppercase; 
        }

        /* BARRA DE BÚSQUEDA */
        .search-container {
            display: flex;
            justify-content: center;
            margin: 20px auto;
            max-width: 600px;
            padding: 0 20px;
            position: relative;
            z-index: 2;
        }

        #search-input {
            width: 100%;
            padding: 12px 20px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        #search-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        #search-input::placeholder {
            color: #666;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.2rem;
            position: relative;
            z-index: 2;
        }
        
        .main-container { 
            max-width: 1600px; margin: 0 auto; padding: 20px; 
            position: relative;
            z-index: 2;
        }
        .section-title { 
            font-size: 1.4rem; color: #fff; border-left: 5px solid var(--neon-pink); 
            padding-left: 15px; margin: 40px 0 20px 0; text-transform: uppercase; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; 
        }

        /* DISEÑO DE TARJETA */
        .card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            border: 2px solid var(--border-color); display: flex; 
            flex-direction: column; cursor: pointer; 
            transition: all 0.3s ease; aspect-ratio: 2/3; 
            position: relative;
        }
        .card:hover { 
            transform: translateY(-10px); border-color: var(--neon-blue); 
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3); 
        }
        
        /* PORTADA (ARRIBA) */
        .card-thumb { 
            width: 100%; height: 75%; 
            background-size: cover; background-position: center; 
            background-color: #0a0c12; display: flex; 
            align-items: center; justify-content: center; 
            border-bottom: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
        }

        .card-thumb::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.3s ease, filter 0.3s ease;
            pointer-events: none;
            z-index: 2;
            filter: brightness(1.2) saturate(1.3);
        }

        .card:hover .card-thumb::before {
            opacity: 1;
        }

        .card-thumb::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0.5) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 1;
        }

        .card:hover .card-thumb::after {
            opacity: 0.3;
        }

        .empty-icon { 
            font-size: 5rem; font-weight: 900; color: #1f243a; 
            user-select: none; 
            position: relative;
            z-index: 1;
        }

        /* TÍTULO (ABAJO) */
        .card-footer { 
            height: 25%; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 5px 10px;
            background: linear-gradient(to bottom, #0d0f16, #050508);
        }
        .card-title { 
            font-size: 0.9rem; font-weight: 800; text-align: center; 
            text-transform: uppercase; color: #fff; width: 100%; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
        }
        .card-status { font-size: 0.65rem; color: var(--neon-blue); margin-top: 4px; font-weight: bold; }

        /* PANTALLA DE CARGA MEJORADA */
        #loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 10000; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
        }

        .progress-container {
            width: 80%; max-width: 400px; height: 12px;
            background: #11131c; border-radius: 20px;
            margin-top: 30px; border: 1px solid #16192b;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 200% 100%;
            animation: rainbow-scroll 2s linear infinite;
            transition: width 0.3s ease;
        }

        .loading-info {
            margin-top: 15px; font-family: monospace; 
            color: var(--neon-blue); font-size: 0.8rem;
            letter-spacing: 2px;
        }

        @keyframes rainbow-scroll {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* RUNTIME JUEGO */
        #game-runtime { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9998; display: none; }
        #game-frame { width: 100%; height: 100%; border: none; }
        #back-btn { 
            position: fixed; bottom: 25px; right: 25px; z-index: 9999; 
            padding: 12px 25px; background: var(--neon-pink); color: white; 
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; 
            text-transform: uppercase; box-shadow: 0 0 15px var(--neon-pink); 
        }

        .spinner { 
            width: 50px; height: 50px; border: 5px solid #111; 
            border-top-color: var(--neon-blue); border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden {
            display: none !important;
        }

        /* Efecto de iluminación dinámica */
        @keyframes glow-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 210, 255, 0.3); }
            50% { box-shadow: 0 0 40px rgba(0, 210, 255, 0.6); }
        }

        .card.bg-active {
            animation: glow-pulse 2s ease-in-out;
        }
    </style>
</head>

        const TOTAL_SLOTS = 100;
        let allCards = [];
        const menuView = document.getElementById('menu-view');
        let currentBgCard = null;

        function generarMenu() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            allCards = [];
            
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                const j = CONFIG[i];
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.index = i;
                card.dataset.searchText = j ? j.titulo.toLowerCase() : "próximamente";
                card.dataset.bgFondo = (j && j.bgFondo) ? j.bgFondo : "";
                
                const tieneImagen = j && j.img && j.img !== "";
                const bgStyle = tieneImagen ? `background-image: url('${j.img}')` : "";
                const titulo = j ? j.titulo : "Próximamente";

                card.innerHTML = `
                    <div class="card-thumb" style="${bgStyle}">
                        ${tieneImagen ? '' : '<span class="empty-icon">?</span>'}
                    </div>
                    <div class="card-footer">
                        <div class="card-title">${titulo}</div>
                        <div class="card-status">${j ? 'ONLINE' : 'OFFLINE'}</div>
                    </div>
                `;

                // Eventos de hover para cambiar fondo de Ultron
                if (j && j.bgFondo && j.bgFondo !== "") {
                    card.addEventListener('mouseenter', () => {
                        cambiarFondoUltron(j.bgFondo);
                        card.classList.add('bg-active');
                        currentBgCard = card;
                    });
                    
                    card.addEventListener('mouseleave', () => {
                        restaurarFondoUltron();
                        card.classList.remove('bg-active');
                        currentBgCard = null;
                    });
                }

                if (j && j.url) {
                    card.onclick = () => lanzarJuego(j.url);
                }
                
                grid.appendChild(card);
                allCards.push(card);
            }
        }

        // Cambiar fondo de Ultron
        function cambiarFondoUltron(bgUrl) {
            menuView.style.backgroundImage = `url('${bgUrl}')`;
            // Efecto de iluminación (aumentar brillo y saturación)
            menuView.style.filter = 'brightness(1.3) saturate(1.2) blur(0.5px)';
            // Aumentar el overlay
            const overlay = menuView.querySelector('::before');
            menuView.style.setProperty('--overlay-opacity', '0.5');
        }

        // Restaurar fondo de Ultron
        function restaurarFondoUltron() {
            menuView.style.backgroundImage = 'none';
            menuView.style.filter = 'brightness(1) saturate(1)';
            menuView.style.setProperty('--overlay-opacity', '0.3');
        }

        // Función de búsqueda
        function filtrarJuegos(termino) {
            const searchInput = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('main-grid');
            const noResults = document.getElementById('no-results');
            let visibles = 0;

            allCards.forEach(card => {
                const searchText = card.dataset.searchText;
                if (searchText.includes(searchInput)) {
                    card.classList.remove('hidden');
                    visibles++;
                } else {
                    card.classList.add('hidden');
                }
            });

            if (visibles === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }
        }

        document.getElementById('search-input').addEventListener('input', filtrarJuegos);

        function lanzarJuego(url) {
            const loader = document.getElementById('loading-screen');
            const runtime = document.getElementById('game-runtime');
            const frame = document.getElementById('game-frame');
            const progressBar = document.getElementById('progress-bar');
            const loadingStats = document.getElementById('loading-stats');

            menuView.style.display = 'none';
            loader.style.display = 'flex';
            
            // Reset de barra
            let progreso = 0;
            progressBar.style.width = '0%';
            frame.src = "about:blank";

            // Simulación de carga
            const intervalo = setInterval(() => {
                if (progreso < 92) {
                    progreso += Math.random() * 2;
                    if (progreso > 92) progreso = 92;
                    progressBar.style.width = progreso + '%';
                    loadingStats.innerText = `DESCOMPRIMIENDO: ${Math.round(progreso)}%`;
                }
            }, 350);

            frame.src = url;

            frame.onload = () => {
                if(frame.src !== "about:blank") {
                    clearInterval(intervalo);
                    progressBar.style.width = '100%';
                    loadingStats.innerText = "¡SISTEMA LISTO!";
                    
                    setTimeout(() => {
                        loader.style.display = 'none';
                        runtime.style.display = 'block';
                    }, 1000);
                }
            };
        }

        function cerrarJuego() {
            document.getElementById('game-runtime').style.display = 'none';
            document.getElementById('game-frame').src = "about:blank";
            menuView.style.display = 'block';
            restaurarFondoUltron();
            window.scrollTo(0,0);
        }

        window.onload = generarMenu;
    </script>
