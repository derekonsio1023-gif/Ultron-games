<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Archivos SWF</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* Contenedor del juego o animación */
        #contenedor-flash {
            width: 800px;
            height: 600px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.5);
            background-color: #000;
        }
    </style>
    <!-- Cargamos el emulador Ruffle de forma gratuita desde una red CDN pública -->
    <script src="https://unpkg.com"></script>
</head>
<body>

    <div id="contenedor-flash"></div>

    <script>
        // Esperamos a que la página y el script de Ruffle carguen por completo
        window.addEventListener("DOMContentLoaded", () => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("contenedor-flash");
            
            // Insertamos el reproductor dentro de nuestro contenedor
            container.appendChild(player);

            // Configuramos las opciones y cargamos tu archivo .swf
            player.load({
                // REEMPLAZA ESTO: Pon la ruta local o URL de tu archivo .swf
                url: "https://rawcdn.githack.com/zaka13alt/assets/300ed9885585131efb4e07f26bb835e100e542ff/swf/trollface-quest-11.swf", 
                allowScriptAccess: true,
                backgroundColor: "#000000"
            });
        });
    </script>

</body>
</html>
