<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c28;
    --border: #2a2a3d; --accent: #ff2d55; --accent2: #ff6b35;
    --text: #f0f0f8; --muted: #6b6b8a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ... (mantengo tus estilos de header, cards, etc. iguales) */

  .modal-player {
    aspect-ratio: 16/9; background: #000; position: relative;
  }
  #playerContainer { width: 100%; height: 100%; }
</style>
</head>
<body>

<!-- ... header y main igual ... -->

<!-- Player Modal -->
<div class="modal-bg" id="playerModal">
  <div style="position:relative; width:100%; max-width:900px;">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal">
      <div class="modal-player">
        <div id="playerContainer"></div>
      </div>
      <div class="modal-info">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-channel" id="modalChannel"></div>
        <div class="modal-actions">
          <button class="modal-btn btn-primary" onclick="openYouTube()">Ver en YouTube</button>
          <button class="modal-btn btn-secondary" onclick="closeModal()">Cerrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentVideoId = '';
  let apiKey = '';
  let ytPlayer = null;   // ← YouTube Player API

  // Cargar la API de YouTube
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  const firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  window.onYouTubeIframeAPIReady = function() {
    console.log('YouTube IFrame API cargada');
  };

  function openVideo(videoId, title, channel) {
    currentVideoId = videoId;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalChannel').textContent = channel;

    const container = document.getElementById('playerContainer');
    container.innerHTML = '<div id="ytplayer"></div>';

    // Crear el reproductor usando la API oficial
    ytPlayer = new YT.Player('ytplayer', {
      height: '100%',
      width: '100%',
      videoId: videoId,
      playerVars: {
        'autoplay': 1,
        'modestbranding': 1,
        'rel': 0,
        'iv_load_policy': 3,
        'fs': 1
      },
      events: {
        'onReady': onPlayerReady
      }
    });

    document.getElementById('playerModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function onPlayerReady(event) {
    event.target.playVideo();
  }

  function closeModal() {
    if (ytPlayer) {
      ytPlayer.stopVideo();
      ytPlayer.destroy();
      ytPlayer = null;
    }
    document.getElementById('playerContainer').innerHTML = '';
    document.getElementById('playerModal').classList.remove('open');
    document.body.style.overflow = '';
  }

  function openYouTube() {
    window.open(`https://www.youtube.com/watch?v=${currentVideoId}`, '_blank');
  }

  // Resto de tu código (search, cards, etc.) se mantiene igual...
</script>
</body>
</html>
