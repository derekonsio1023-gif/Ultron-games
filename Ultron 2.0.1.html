<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON AI</title>
    <style>
        :root { 
            --bg-color: #050508; 
            --card-bg: #0d0f16; 
            --border-color: #16192b; 
            --neon-blue: #00d2ff; 
            --neon-pink: #ff0055; 
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', sans-serif; color: white; 
            overflow-x: hidden; 
        }
        
        header { text-align: center; padding: 40px 20px; }
        h1 { 
            margin: 0; font-size: 5rem; font-weight: 900; letter-spacing: 5px; 
            color: var(--neon-blue); text-shadow: 0 0 20px rgba(0, 210, 255, 0.5); 
            text-transform: uppercase; 
        }
        
        .main-container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        .section-title { 
            font-size: 1.4rem; color: #fff; border-left: 5px solid var(--neon-pink); 
            padding-left: 15px; margin: 40px 0 20px 0; text-transform: uppercase; 
        }

        .counter-banner {
            margin: 18px auto 0;
            max-width: 1600px;
            padding: 12px 16px;
            border: 1px solid rgba(0,210,255,0.35);
            background: rgba(0, 210, 255, 0.08);
            border-radius: 12px;
            color: #c8f8ff;
            font-size: 0.92rem;
            line-height: 1.35;
        }
        .counter-banner strong { color: #fff; }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; 
        }

        /* DISEÑO DE TARJETA */
        .card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            border: 2px solid var(--border-color); display: flex; 
            flex-direction: column; cursor: pointer; 
            transition: all 0.3s ease; aspect-ratio: 2/3; 
        }
        .card:hover { 
            transform: translateY(-10px); border-color: var(--neon-blue); 
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3); 
        }
        
        /* PORTADA (ARRIBA) */
        .card-thumb { 
            width: 100%; height: 75%; 
            background-size: cover; background-position: center; 
            background-color: #0a0c12; display: flex; 
            align-items: center; justify-content: center; 
            border-bottom: 2px solid var(--border-color);
        }

        .empty-icon { 
            font-size: 5rem; font-weight: 900; color: #1f243a; 
            user-select: none; 
        }

        /* TÍTULO (ABAJO) */
        .card-footer { 
            height: 25%; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 5px 10px;
            background: linear-gradient(to bottom, #0d0f16, #050508);
        }
        .card-title { 
            font-size: 0.9rem; font-weight: 800; text-align: center; 
            text-transform: uppercase; color: #fff; width: 100%; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
        }
        .card-status { font-size: 0.65rem; color: var(--neon-blue); margin-top: 4px; font-weight: bold; }
        .card-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 4px;
            flex-wrap: wrap;
        }

        .card-popularity {
            font-size: 0.64rem;
            color: #7df9ff;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(0, 210, 255, 0.12);
            border: 1px solid rgba(0, 210, 255, 0.22);
            white-space: nowrap;
        }

        .card.hidden {
            display: none !important;
        }

        .sort-select {
            border: 1px solid rgba(0, 210, 255, 0.28);
            background: rgba(10, 12, 22, 0.95);
            color: white;
            border-radius: 12px;
            padding: 10px 12px;
            font-weight: 700;
            outline: none;
            cursor: pointer;
        }

        .sort-select option {
            background: #0d0f16;
            color: white;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        @media (max-width: 760px) {
            .search-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-actions {
                justify-content: space-between;
            }

            #search-input {
                min-width: 0;
            }
        }



        /* BARRA DE BÚSQUEDA */
        .search-wrapper {
            position: sticky;
            top: 14px;
            z-index: 50;
            margin: 0 auto 28px auto;
            max-width: 900px;
            padding: 12px;
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(0,210,255,0.08), rgba(255,0,85,0.08));
            border: 1px solid rgba(0, 210, 255, 0.22);
            box-shadow: 0 12px 35px rgba(0,0,0,0.35), inset 0 0 25px rgba(0,210,255,0.06);
            backdrop-filter: blur(12px);
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(5, 8, 16, 0.88);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 14px 16px;
        }

        .search-icon {
            font-size: 1.2rem;
            color: var(--neon-blue);
            text-shadow: 0 0 12px rgba(0,210,255,0.55);
            flex: 0 0 auto;
            user-select: none;
        }

        #search-input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        
        .hero-header{
    text-align: center;
    padding: 40px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.logo-ultron{
    width: 180px;
    max-width: 70vw;
    height: auto;
    display: block;
    filter: drop-shadow(0 0 18px rgba(0, 210, 255, 0.35));
}

        #search-input::placeholder {
            color: rgba(255,255,255,0.45);
            font-weight: 600;
        }

        .search-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }

        #clear-search {
            border: none;
            background: linear-gradient(90deg, var(--neon-pink), #ff7a18);
            color: white;
            font-weight: 800;
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            box-shadow: 0 0 14px rgba(255,0,85,0.35);
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        #clear-search:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .search-hint {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.6);
            text-align: center;
            margin-top: 8px;
            letter-spacing: 0.6px;
        }

        .results-count {
            font-size: 0.8rem;
            color: var(--neon-blue);
            font-weight: 700;
            margin-left: auto;
            white-space: nowrap;
        }

        .card.hidden {
            display: none;
        }

        @media (max-width: 640px) {
            .search-wrapper {
                top: 8px;
                padding: 10px;
                border-radius: 18px;
            }
            .search-bar {
                padding: 12px 13px;
                gap: 10px;
                flex-wrap: wrap;
            }
            .results-count {
                width: 100%;
                margin-left: 0;
                order: 3;
                text-align: right;
            }
            #clear-search {
                padding: 9px 12px;
            }
        }

        /* PANTALLA DE CARGA MEJORADA */
        #loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 10000; display: none; 
            flex-direction: column; align-items: center; justify-content: center; 
        }

        .progress-container {
            width: 80%; max-width: 400px; height: 12px;
            background: #11131c; border-radius: 20px;
            margin-top: 30px; border: 1px solid #16192b;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 200% 100%;
            animation: rainbow-scroll 2s linear infinite;
            transition: width 0.3s ease;
        }

        .loading-info {
            margin-top: 15px; font-family: monospace; 
            color: var(--neon-blue); font-size: 0.8rem;
            letter-spacing: 2px;
        }

        @keyframes rainbow-scroll {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* RUNTIME JUEGO */
        #game-runtime { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9998; display: none; }
        #game-frame { width: 100%; height: 100%; border: none; }
        #back-btn { 
            position: fixed; bottom: 25px; right: 25px; z-index: 9999; 
            padding: 12px 25px; background: var(--neon-pink); color: white; 
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; 
            text-transform: uppercase; box-shadow: 0 0 15px var(--neon-pink); 
        }

        .spinner { 
            width: 50px; height: 50px; border: 5px solid #111; 
            border-top-color: var(--neon-blue); border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

                        <button id="clear-search" type="button">Limpiar</button>

                <div class="search-hint">Búsqueda rápida sin complicaciones</div>

            <div id="main-grid" class="grid"></div>

                }
            }
        }

        const storage = getStorage();

        function cargarContadoresLocales() {
            if (!storage) return {};
            try {
                const raw = storage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                return {};
            }
        }

        function guardarContadoresLocales(data) {
            if (!storage) return;
            try {
                storage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function remoteKey(slot) {
            return `slot-${slot}`;
        }

        function getGameCount(game, slot) {
            return Number(playCountsCache[remoteKey(slot)] || 0);
        }

        async function inicializarCounterAPI() {
            try {
                const placeholder = !COUNTER_WORKSPACE || COUNTER_WORKSPACE.includes('PON_AQUI');
                if (placeholder || typeof Counter !== 'function') {
                    remoteCounterAvailable = false;
                    remoteCounter = null;
                    return false;
                }
                remoteCounter = new Counter({ workspace: COUNTER_WORKSPACE });
                remoteCounterAvailable = true;
                return true;
            } catch (e) {
                remoteCounterAvailable = false;
                remoteCounter = null;
                return false;
            }
        }

        function actualizarBannerCounter() {
            const banner = document.getElementById('counter-banner');
            if (!banner) return;
            if (remoteCounterAvailable) {
                banner.innerHTML = '<strong>Popularidad global activa:</strong> los contadores se están leyendo y sumando en CounterAPI.';
            } else {
                banner.innerHTML = '<strong>Popularidad global desactivada:</strong> crea un workspace en CounterAPI y escribe su nombre en <code>COUNTER_WORKSPACE</code>. El menú sigue funcionando con respaldo local.';
            }
        }

        async function cargarContadoresGlobales() {
            const local = cargarContadoresLocales();
            playCountsCache = { ...local };

            const activeSlots = Object.keys(CONFIG)
                .map(Number)
                .filter((n) => CONFIG[n] && CONFIG[n].url);

            if (!remoteCounterAvailable) {
                return;
            }

            try {
                const results = await Promise.all(activeSlots.map(async (slot) => {
                    try {
                        const res = await remoteCounter.get(remoteKey(slot));
                        const value = Number(res?.value ?? res?.data ?? 0);
                        return [remoteKey(slot), Number.isFinite(value) ? value : 0];
                    } catch (e) {
                        return [remoteKey(slot), Number(local[remoteKey(slot)] || 0)];
                    }
                }));

                for (const [key, value] of results) {
                    playCountsCache[key] = value;
                }

                guardarContadoresLocales(playCountsCache);
            } catch (e) {
                // si falla, seguimos con el fallback local
            }
        }

        async function incrementarContador(game, slot) {
            const key = remoteKey(slot);
            playCountsCache[key] = Number(playCountsCache[key] || 0) + 1;
            guardarContadoresLocales(playCountsCache);

            if (!remoteCounterAvailable) return;

            try {
                const res = await remoteCounter.up(key);
                const value = Number(res?.value ?? res?.data ?? playCountsCache[key]);
                if (Number.isFinite(value)) {
                    playCountsCache[key] = value;
                    guardarContadoresLocales(playCountsCache);
                }
            } catch (e) {
                // si la API remota falla, el fallback local mantiene la UI viva
            }
        }

        function getEntries() {

            const entries = [];
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                entries.push([i, CONFIG[i] || null]);
            }
            return entries;
        }

        function ordenarEntradas(entries) {
            const decorated = entries.map(([slot, game]) => {
                const titulo = game ? game.titulo : 'Próximamente';
                const count = game ? getGameCount(game, slot) : 0;
                return { slot, game, titulo, count };
            });

            switch (currentSort) {
                case 'popular':
                    decorated.sort((a, b) => (b.count - a.count) || a.titulo.localeCompare(b.titulo, 'es'));
                    break;
                case 'unpopular':
                    decorated.sort((a, b) => (a.count - b.count) || a.titulo.localeCompare(b.titulo, 'es'));
                    break;
                case 'az':
                    decorated.sort((a, b) => a.titulo.localeCompare(b.titulo, 'es'));
                    break;
                default:
                    decorated.sort((a, b) => a.slot - b.slot);
            }
            return decorated;
        }

        function renderMenu() {
            const grid = document.getElementById('main-grid');
            const ordered = ordenarEntradas(getEntries());

            grid.innerHTML = '';

            for (const item of ordered) {
                const { slot, game } = item;
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.title = (game ? game.titulo : 'Próximamente').toLowerCase();
                card.dataset.slot = String(slot);

                const tieneImagen = game && game.img && game.img !== '';
                const bgStyle = tieneImagen ? `background-image: url('${game.img}')` : '';
                const titulo = game ? game.titulo : 'Próximamente';
                const cuenta = game ? getGameCount(game, slot) : 0;

                card.innerHTML = `
                    <div class="card-thumb" style="${bgStyle}">
                        ${tieneImagen ? '' : '<span class="empty-icon">?</span>'}
                    </div>
                    <div class="card-footer">
                        <div class="card-title">${titulo}</div>
                        <div class="card-meta">
                            <div class="card-status">${game ? 'ONLINE' : 'OFFLINE'}</div>
                            <div class="card-popularity">👥 ${cuenta}</div>
                        </div>
                    </div>
                `;

                if (game && game.url) {
                    card.onclick = () => lanzarJuego(game, slot);
                }

                grid.appendChild(card);
            }

            actualizarBusqueda();
            actualizarContadoresUI();
        }

        function actualizarBusqueda() {
            const input = document.getElementById('search-input');
            const query = (input?.value || '').trim().toLowerCase();
            const cards = document.querySelectorAll('#main-grid .card');
            const count = document.getElementById('results-count');
            let visibles = 0;

            cards.forEach(card => {
                const titulo = card.dataset.title || '';
                const coincide = !query || titulo.includes(query);
                card.classList.toggle('hidden', !coincide);
                if (coincide) visibles++;
            });

            if (count) {
                count.textContent = query ? `${visibles} resultado${visibles === 1 ? '' : 's'}` : `${cards.length} juegos`;
            }
        }

        function actualizarContadoresUI() {
            document.querySelectorAll('#main-grid .card').forEach(card => {
                const slot = Number(card.dataset.slot || 0);
                const game = CONFIG[slot];
                const count = game ? getGameCount(game, slot) : 0;
                const countEl = card.querySelector('.card-popularity');
                if (countEl) countEl.textContent = `👥 ${count}`;
            });
        }

        async function lanzarJuego(game, slot) {
            await incrementarContador(game, slot);
            actualizarContadoresUI();

            const menu = document.getElementById('menu-view');
            const loader = document.getElementById('loading-screen');
            const runtime = document.getElementById('game-runtime');
            const frame = document.getElementById('game-frame');
            const progressBar = document.getElementById('progress-bar');
            const loadingStats = document.getElementById('loading-stats');

            menu.style.display = 'none';
            loader.style.display = 'flex';

            let progreso = 0;
            progressBar.style.width = '0%';
            frame.src = 'about:blank';

            const intervalo = setInterval(() => {
                if (progreso < 92) {
                    progreso += Math.random() * 2;
                    if (progreso > 92) progreso = 92;
                    progressBar.style.width = progreso + '%';
                    loadingStats.innerText = `DESCOMPRIMIENDO: ${Math.round(progreso)}%`;
                }
            }, 350);

            frame.src = game.url;

            frame.onload = () => {
                if (frame.src !== 'about:blank') {
                    clearInterval(intervalo);
                    progressBar.style.width = '100%';
                    loadingStats.innerText = '¡SISTEMA LISTO!';

                    setTimeout(() => {
                        loader.style.display = 'none';
                        runtime.style.display = 'block';
                    }, 1000);
                }
            };
        }

        function cerrarJuego() {
            document.getElementById('game-runtime').style.display = 'none';
            document.getElementById('game-frame').src = 'about:blank';
            document.getElementById('menu-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        async function initUltron() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');
            const sortSelect = document.getElementById('sort-select');
            const counterStatus = document.getElementById('counter-status');

            if (input) {
                input.addEventListener('input', actualizarBusqueda);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        input.value = '';
                        actualizarBusqueda();
                        input.blur();
                    }
                });
            }

            if (clearBtn && input) {
                clearBtn.addEventListener('click', () => {
                    input.value = '';
                    actualizarBusqueda();
                    input.focus();
                });
            }

            if (sortSelect) {
                sortSelect.addEventListener('change', () => {
                    currentSort = sortSelect.value;
                    renderMenu();
                });
            }

            await inicializarCounterAPI();
            if (counterStatus) {
                counterStatus.textContent = remoteCounterAvailable
                    ? `CONTADOR GLOBAL: ON (${COUNTER_WORKSPACE})`
                    : 'CONTADOR GLOBAL: FALLBACK LOCAL';
            }
            await cargarContadoresGlobales();
            renderMenu();
        }

        window.addEventListener('load', initUltron);
    </script>

</body>
</html>
