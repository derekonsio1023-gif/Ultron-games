<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Trees Hate You</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #231F20;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }
      #loading-text {
        font-weight: bold;
        background: linear-gradient(270deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: rainbow 3s ease infinite;
        font-size: 48px;
        font-family: cursive;
        text-align: center;
        margin-top: 20px;
        position: relative;
        z-index: 10;
      }
      @keyframes rainbow {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
    </style>
  </head>
  <body>
    <div id="loading-text">LOADING...</div>
    <canvas id="unity-canvas"></canvas>

    <!-- Cargador Oficial de Unity para Trees Hate You desde el CDN original -->
    <script src="https://jsdelivr.net"></script>
    
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loadingText = document.querySelector("#loading-text");

      // Las rutas absolutas correctas del juego Trees Hate You en el repositorio
      const buildUrl = "https://jsdelivr.net";
      
      createUnityInstance(canvas, {
        dataUrl: buildUrl + "/2e6b9ad94eed2790c664210defe740da.data.unityweb",
        frameworkUrl: buildUrl + "/6f314fe54fd9b4f06bc4efe696cc6531.framework.js.unityweb",
        codeUrl: buildUrl + "/f0058840c570f9f85a2e5851e27b0f70.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Trees Hate You",
        productVersion: "1.0",
      }).then((unityInstance) => {
        loadingText.remove();
      }).catch((message) => {
        alert("Error al cargar el juego: " + message);
      });
    </script>
  </body>
</html>
