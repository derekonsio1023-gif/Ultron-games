            width: 100%;

        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .game-card {
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .game-card:hover {
            transform: scale(1.05);
        }
        iframe {
            width: 100%;
            height: 400px;
            border: none;
        }
        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 3em;
            animation: pixelate 2s steps(5, end) infinite alternate;
        }

        @keyframes pixelate {
            from {
                letter-spacing: -10px;
            }
            to {
                letter-spacing: 10px;
            }
        }

        .favorite {
            background-color: yellow;
        }

        const gameGrid = document.getElementById('game-grid');
        const searchBar = document.getElementById('search-bar');

        function loadGames() {
            CONFIG.GAME_DATA.forEach(game => {
                const card = document.createElement('div');
                card.classList.add('game-card');
                card.innerHTML = `
                    <h2>${game.title}</h2>
                    <img src="${game.image}" alt="${game.title}">
                    <p>Veces jugado: ${game.playCount}</p>
                    <button onclick="toggleFavorite(game)">Favorito</button>
                `;
                card.onclick = () => playGame(game);
                gameGrid.appendChild(card);
            });
        }

        function sortGames(criteria) {
            switch (criteria) {
                case 'default':
                    CONFIG.GAME_DATA.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case 'popularity':
                    CONFIG.GAME_DATA.sort((a, b) => b.playCount - a.playCount);
                    break;
                case 'alphabetical':
                    CONFIG.GAME_DATA.sort((a, b) => a.title.localeCompare(b.title));
                    break;
            }
            gameGrid.innerHTML = '';
            loadGames();
        }

        async function updateGlobalCounter(gameTitle) {
            try {
                const response = await fetch(`https://api.countapi.xyz/hit/${CONFIG.API_KEY}/${gameTitle}`);
                if (response.ok) {
                    console.log('Contador global actualizado');
                } else {
                    console.error('Error al actualizar el contador global');
                }
            } catch (error) {
                console.error('Error de red:', error);
            }
        }

        function playGame(game) {
            game.playCount++;
            updateGlobalCounter(game.title);
            document.getElementById('game-frame').src = `games/${game.image.replace('.png', '.html')}`;
            document.getElementById('game-frame').style.display = 'block';
            saveProgress();
        }

        function toggleFavorite(game) {
            game.isFavorite = !game.isFavorite;
            updateGameCard(game);
            saveFavorites();
        }

        function updateGameCard(game) {
            const card = gameGrid.querySelector(`.game-card h2:contains(${game.title})`).parentElement;
            if (game.isFavorite) {
                card.classList.add('favorite');
            } else {
                card.classList.remove('favorite');
            }
        }

        function saveProgress() {
            localStorage.setItem('gameData', JSON.stringify(CONFIG.GAME_DATA));
        }

        function loadProgress() {
            const savedData = localStorage.getItem('gameData');
            if (savedData) {
                CONFIG.GAME_DATA = JSON.parse(savedData);
            }
        }

        function saveFavorites() {
            localStorage.setItem('favorites', JSON.stringify(CONFIG.GAME_DATA.filter(game => game.isFavorite)));
        }

        function loadFavorites() {
            const favoritesData = localStorage.getItem('favorites');
            if (favoritesData) {
                const favorites = JSON.parse(favoritesData);
                favorites.forEach(favorite => {
                    const game = CONFIG.GAME_DATA.find(g => g.title === favorite.title);
                    if (game) {
                        game.isFavorite = true;
                    }
                });
            }
        }

        searchBar.addEventListener('input', () => {
            const query = searchBar.value.toLowerCase();
            CONFIG.GAME_DATA.forEach(game => {
                const card = gameGrid.querySelector(`h2:contains(${query})`);
                if (card) {
                    card.parentElement.style.display = '';
                } else {
                    card.parentElement.style.display = 'none';
                }
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            loadFavorites();
            loadGames();
        });
    </script>
