<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTube</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #ff2d55;
    --accent2: #ff6b35;
    --text: #f0f0f8;
    --muted: #6b6b8a;
    --card-hover: #1e1e2e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.4;
  }

  /* HEADER */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    flex-shrink: 0;
    cursor: pointer;
  }

  .logo span {
    color: var(--text);
    -webkit-text-fill-color: var(--text);
  }

  /* SEARCH BAR */
  .search-wrap {
    flex: 1;
    max-width: 600px;
    display: flex;
    gap: 0;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-right: none;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 10px 18px;
    border-radius: 8px 0 0 8px;
    outline: none;
    transition: border-color 0.2s;
  }

  .search-wrap input:focus {
    border-color: var(--accent);
  }

  .search-wrap input::placeholder { color: var(--muted); }

  .search-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: white;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 0 8px 8px 0;
    font-size: 18px;
    transition: opacity 0.2s, transform 0.1s;
    flex-shrink: 0;
  }

  .search-btn:hover { opacity: 0.85; }
  .search-btn:active { transform: scale(0.96); }

  /* MAIN */
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 24px;
  }

  /* HERO / HOME */
  .hero {
    text-align: center;
    padding: 80px 20px 60px;
    animation: fadeUp 0.6s ease both;
  }

  .hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(56px, 10vw, 110px);
    letter-spacing: 4px;
    line-height: 1;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 70%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
  }

  .hero p {
    color: var(--muted);
    font-size: 17px;
    margin-bottom: 40px;
  }

  .hero-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
  }

  .tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }

  .tag:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,45,85,0.08);
  }

  /* SECTION TITLE */
  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: var(--text);
  }

  .section-count {
    background: rgba(255,45,85,0.15);
    color: var(--accent);
    border: 1px solid rgba(255,45,85,0.3);
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }

  /* VIDEO GRID */
  .video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    animation: fadeUp 0.5s ease both;
  }

  /* VIDEO CARD */
  .video-card {
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.25s ease;
    animation: fadeUp 0.4s ease both;
  }

  .video-card:hover {
    border-color: var(--border);
    background: var(--card-hover);
    transform: translateY(-4px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.4);
  }

  .thumbnail-wrap {
    position: relative;
    aspect-ratio: 16/9;
    overflow: hidden;
    background: var(--surface2);
  }

  .thumbnail-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s ease;
  }

  .video-card:hover .thumbnail-wrap img {
    transform: scale(1.05);
  }

  .duration-badge {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0,0,0,0.82);
    color: white;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.5px;
  }

  .play-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s;
  }

  .video-card:hover .play-overlay {
    background: rgba(0,0,0,0.35);
  }

  .play-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.6);
    transition: all 0.25s ease;
    box-shadow: 0 8px 24px rgba(255,45,85,0.5);
  }

  .video-card:hover .play-icon {
    opacity: 1;
    transform: scale(1);
  }

  .play-icon::after {
    content: '';
    border-left: 18px solid white;
    border-top: 11px solid transparent;
    border-bottom: 11px solid transparent;
    margin-left: 4px;
  }

  .card-info {
    padding: 14px 16px 16px;
  }

  .card-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--text);
  }

  .card-channel {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    margin-bottom: 4px;
  }

  .card-meta {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 8px;
  }

  .card-meta span::before {
    content: '·';
    margin-right: 8px;
    opacity: 0.5;
  }

  .card-meta span:first-child::before { display: none; }

  /* PLAYER MODAL */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 500;
    backdrop-filter: blur(12px);
    animation: fadeIn 0.2s ease;
    padding: 20px;
    align-items: center;
    justify-content: center;
  }

  .modal-bg.open { display: flex; }

  .modal {
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    width: 100%;
    max-width: 900px;
    border: 1px solid var(--border);
    box-shadow: 0 40px 100px rgba(0,0,0,0.7);
    animation: scaleUp 0.25s ease;
  }

  .modal-player {
    aspect-ratio: 16/9;
    width: 100%;
    background: #000;
  }

  .modal-player iframe {
    width: 100%;
    height: 100%;
    border: none;
  }

  .modal-info {
    padding: 20px 24px;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .modal-channel {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .modal-actions {
    display: flex;
    gap: 12px;
  }

  .modal-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary:hover { opacity: 0.85; }

  .modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.1);
    border: none;
    border-radius: 50%;
    color: white;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    z-index: 10;
  }

  .modal-close:hover { background: rgba(255,45,85,0.5); }

  /* STATES */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 20px;
    gap: 20px;
    animation: fadeIn 0.3s ease;
  }

  .spinner {
    width: 48px;
    height: 48px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  .loading p { color: var(--muted); font-size: 15px; }

  .error-state {
    text-align: center;
    padding: 80px 20px;
    animation: fadeUp 0.4s ease;
  }

  .error-icon {
    font-size: 56px;
    margin-bottom: 16px;
  }

  .error-state h3 { font-size: 20px; margin-bottom: 8px; }
  .error-state p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

  .retry-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    padding: 10px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: opacity 0.2s;
  }

  .retry-btn:hover { opacity: 0.85; }

  /* API KEY SETUP */
  .setup-screen {
    max-width: 520px;
    margin: 60px auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    text-align: center;
    animation: fadeUp 0.5s ease;
  }

  .setup-icon {
    font-size: 52px;
    margin-bottom: 20px;
  }

  .setup-screen h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    letter-spacing: 2px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--text), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .setup-screen p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 28px;
  }

  .setup-screen a {
    color: var(--accent);
    text-decoration: none;
  }

  .setup-screen a:hover { text-decoration: underline; }

  .setup-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    outline: none;
    margin-bottom: 14px;
    transition: border-color 0.2s;
  }

  .setup-input:focus { border-color: var(--accent); }
  .setup-input::placeholder { color: var(--muted); }

  .setup-submit {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    transition: opacity 0.2s, transform 0.1s;
  }

  .setup-submit:hover { opacity: 0.88; }
  .setup-submit:active { transform: scale(0.98); }

  .setup-note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 14px;
    line-height: 1.6;
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes scaleUp {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Staggered cards */
  .video-card:nth-child(1) { animation-delay: 0.05s; }
  .video-card:nth-child(2) { animation-delay: 0.1s; }
  .video-card:nth-child(3) { animation-delay: 0.15s; }
  .video-card:nth-child(4) { animation-delay: 0.2s; }
  .video-card:nth-child(5) { animation-delay: 0.25s; }
  .video-card:nth-child(6) { animation-delay: 0.3s; }
  .video-card:nth-child(7) { animation-delay: 0.35s; }
  .video-card:nth-child(8) { animation-delay: 0.4s; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  .modal-bg { position: fixed; }

  @media (max-width: 600px) {
    header { padding: 0 14px; gap: 12px; }
    .logo { font-size: 22px; }
    main { padding: 20px 14px; }
    .setup-screen { padding: 32px 20px; margin: 30px auto; }
    .video-grid { grid-template-columns: 1fr; }
    .modal-info { padding: 16px; }
    .modal-title { font-size: 15px; }
    .modal-actions { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">My<span>Tube</span></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Busca cualquier cosa..." autocomplete="off" />
    <button class="search-btn" onclick="doSearch()" title="Buscar">&#128269;</button>
  </div>
</header>

<main id="mainContent"></main>

<!-- Player Modal -->
<div class="modal-bg" id="playerModal">
  <div style="position:relative; width:100%; max-width:900px;">
    <button class="modal-close" onclick="closeModal()">&#10005;</button>
    <div class="modal">
      <div class="modal-player" id="modalPlayer"></div>
      <div class="modal-info">
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-channel" id="modalChannel"></div>
        <div class="modal-actions">
          <button class="modal-btn btn-primary" onclick="openYouTube()">&#128279; Ver en YouTube</button>
          <button class="modal-btn btn-secondary" onclick="closeModal()">&#10005; Cerrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ─── CONFIG ───────────────────────────────────────────────
  const STORAGE_KEY = 'mytube_api_key';
  const POPULAR_QUERIES = ['música', 'gaming', 'programación', 'cocina', 'deportes', 'ciencia', 'viajes', 'películas'];
  let currentVideoId = '';
  let apiKey = '';

  // ─── INIT ─────────────────────────────────────────────────
  window.onload = () => {
    apiKey = localStorage.getItem(STORAGE_KEY) || '';
    if (!apiKey) {
      showSetup();
    } else {
      showHome();
    }

    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
  };

  // ─── API KEY SETUP ─────────────────────────────────────────
  function showSetup() {
    document.getElementById('mainContent').innerHTML = `
      <div class="setup-screen">
        <div class="setup-icon">🔑</div>
        <h2>Configura tu API Key</h2>
        <p>
          MyTube usa la <strong>YouTube Data API v3</strong> (gratuita con cuota diaria).
          Necesitas una API Key de Google para buscar vídeos.<br><br>
          Consíguela gratis en
          <a href="https://console.cloud.google.com/" target="_blank">Google Cloud Console</a> →
          Habilita "YouTube Data API v3" → Credenciales → Crear API Key.
        </p>
        <input class="setup-input" id="apiKeyInput" type="text" placeholder="Pega aquí tu API Key..." />
        <button class="setup-submit" onclick="saveApiKey()">Guardar y continuar</button>
        <p class="setup-note">
          Tu clave se guarda <strong>solo en tu navegador</strong> (localStorage).<br>
          La cuota gratuita es de 10.000 unidades diarias — suficiente para cientos de búsquedas.
        </p>
      </div>
    `;
  }

  function saveApiKey() {
    const input = document.getElementById('apiKeyInput').value.trim();
    if (!input) { alert('Escribe tu API Key primero.'); return; }
    apiKey = input;
    localStorage.setItem(STORAGE_KEY, apiKey);
    showHome();
  }

  // ─── HOME ──────────────────────────────────────────────────
  function showHome() {
    document.getElementById('mainContent').innerHTML = `
      <div class="hero">
        <h1>Descubre<br>tu próximo<br>vídeo</h1>
        <p>Busca cualquier tema y encuentra los mejores vídeos al instante</p>
        <div class="hero-tags">
          ${POPULAR_QUERIES.map(q => `<span class="tag" onclick="quickSearch('${q}')">${q}</span>`).join('')}
          <span class="tag" onclick="changeKey()" style="border-color: rgba(255,45,85,0.3); color: #ff2d55;">⚙ Cambiar API Key</span>
        </div>
      </div>
    `;
  }

  function goHome() {
    document.getElementById('searchInput').value = '';
    showHome();
  }

  function quickSearch(term) {
    document.getElementById('searchInput').value = term;
    doSearch();
  }

  function changeKey() {
    localStorage.removeItem(STORAGE_KEY);
    apiKey = '';
    showSetup();
  }

  // ─── SEARCH ───────────────────────────────────────────────
  async function doSearch() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) return;
    if (!apiKey) { showSetup(); return; }

    showLoading(`Buscando "${query}"...`);

    try {
      const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&maxResults=16&key=${apiKey}`;
      const res = await fetch(url);
      const data = await res.json();

      if (data.error) {
        throw new Error(data.error.message || 'Error de API');
      }

      if (!data.items || data.items.length === 0) {
        showError('Sin resultados', `No encontramos vídeos para "${query}". Prueba con otra búsqueda.`);
        return;
      }

      // Get video details (duration, view count)
      const ids = data.items.map(i => i.id.videoId).join(',');
      const detailsUrl = `https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics&id=${ids}&key=${apiKey}`;
      const detailsRes = await fetch(detailsUrl);
      const detailsData = await detailsRes.json();

      const detailsMap = {};
      (detailsData.items || []).forEach(item => {
        detailsMap[item.id] = {
          duration: parseDuration(item.contentDetails?.duration || ''),
          views: formatViews(item.statistics?.viewCount || 0)
        };
      });

      renderResults(data.items, detailsMap, query);

    } catch (err) {
      console.error(err);
      if (err.message.includes('API key') || err.message.includes('keyInvalid') || err.message.includes('badRequest')) {
        showError('API Key inválida', 'Tu API Key no es válida o no tiene la YouTube Data API activada.', true);
      } else if (err.message.includes('quota')) {
        showError('Cuota agotada', 'Has alcanzado el límite diario gratuito de la API. Inténtalo mañana.');
      } else {
        showError('Error de red', 'No se pudo conectar. Comprueba tu conexión a internet.');
      }
    }
  }

  // ─── RENDER RESULTS ───────────────────────────────────────
  function renderResults(items, detailsMap, query) {
    const cards = items.map(item => {
      const vid = item.id.videoId;
      const s = item.snippet;
      const thumb = s.thumbnails?.medium?.url || s.thumbnails?.default?.url || '';
      const title = escHtml(s.title);
      const channel = escHtml(s.channelTitle);
      const date = timeAgo(s.publishedAt);
      const d = detailsMap[vid] || {};
      const dur = d.duration || '';
      const views = d.views ? `${d.views} vistas` : '';

      return `
        <div class="video-card" onclick="openVideo('${vid}', \`${title.replace(/`/g,'\\`')}\`, \`${channel.replace(/`/g,'\\`')}\`)">
          <div class="thumbnail-wrap">
            <img src="${thumb}" alt="${title}" loading="lazy" />
            <div class="play-overlay"><div class="play-icon"></div></div>
            ${dur ? `<div class="duration-badge">${dur}</div>` : ''}
          </div>
          <div class="card-info">
            <div class="card-title">${title}</div>
            <div class="card-channel">${channel}</div>
            <div class="card-meta">
              ${views ? `<span>${views}</span>` : ''}
              ${date ? `<span>${date}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('mainContent').innerHTML = `
      <div class="section-header">
        <div class="section-title">Resultados para "${escHtml(query)}"</div>
        <div class="section-count">${items.length} vídeos</div>
      </div>
      <div class="video-grid">${cards}</div>
    `;
  }

  // ─── PLAYER ───────────────────────────────────────────────
  function openVideo(videoId, title, channel) {
    currentVideoId = videoId;
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalChannel').textContent = channel;
    document.getElementById('modalPlayer').innerHTML = `
      <iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0"
        allow="autoplay; encrypted-media; fullscreen"
        allowfullscreen>
      </iframe>`;
    document.getElementById('playerModal').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    document.getElementById('playerModal').classList.remove('open');
    document.getElementById('modalPlayer').innerHTML = '';
    document.body.style.overflow = '';
  }

  function openYouTube() {
    window.open(`https://www.youtube.com/watch?v=${currentVideoId}`, '_blank');
  }

  document.getElementById('playerModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // ─── STATES ───────────────────────────────────────────────
  function showLoading(msg) {
    document.getElementById('mainContent').innerHTML = `
      <div class="loading">
        <div class="spinner"></div>
        <p>${escHtml(msg)}</p>
      </div>
    `;
  }

  function showError(title, msg, showChangeKey = false) {
    document.getElementById('mainContent').innerHTML = `
      <div class="error-state">
        <div class="error-icon">⚠️</div>
        <h3>${escHtml(title)}</h3>
        <p>${escHtml(msg)}</p>
        ${showChangeKey
          ? `<button class="retry-btn" onclick="changeKey()">Cambiar API Key</button>`
          : `<button class="retry-btn" onclick="goHome()">Volver al inicio</button>`
        }
      </div>
    `;
  }

  // ─── UTILS ────────────────────────────────────────────────
  function escHtml(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function parseDuration(iso) {
    const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    if (!m) return '';
    const h = parseInt(m[1] || 0), min = parseInt(m[2] || 0), s = parseInt(m[3] || 0);
    if (h > 0) return `${h}:${pad(min)}:${pad(s)}`;
    return `${min}:${pad(s)}`;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function formatViews(n) {
    n = parseInt(n);
    if (isNaN(n)) return '';
    if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return String(n);
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    const diff = Date.now() - new Date(dateStr).getTime();
    const d = Math.floor(diff / 86400000);
    if (d < 1) return 'Hoy';
    if (d < 7) return `hace ${d} día${d>1?'s':''}`;
    const w = Math.floor(d/7);
    if (w < 5) return `hace ${w} semana${w>1?'s':''}`;
    const mo = Math.floor(d/30);
    if (mo < 12) return `hace ${mo} mes${mo>1?'es':''}`;
    const y = Math.floor(d/365);
    return `hace ${y} año${y>1?'s':''}`;
  }
</script>
</body>
</html>
