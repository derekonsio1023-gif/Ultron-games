<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciador de YouTube Seguro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .launch-btn { padding: 15px 30px; font-size: 18px; border: none; background: #ff0000; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; box-shadow: 0 4px 15px rgba(255,0,0,0.4); }
    </style>
</head>
<body>

    <!-- Al hacer clic, se generará todo de forma segura dentro de about:blank -->
    <button class="launch-btn" onclick="abrirEnBlank()">Abrir Buscador en about:blank</button>

<script>
    function abrirEnBlank() {
        const nuevaVentana = window.open('about:blank', '_blank');
        if (!nuevaVentana) {
            alert("Por favor, permite los elementos emergentes (pop-ups) en tu navegador.");
            return;
        }

        // Definimos AQUÍ tu clave de la API de YouTube
        const API_KEY = 'TU_YOUTUBE_API_KEY_AQUÍ'; 

        // Todo el HTML, CSS y JS compilado en una sola cadena de texto limpia
        const codigoCompleto = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Buscador Desbloqueado</title>
    <link rel="stylesheet" href="https://plyr.io" />
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .search-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 4px; border: none; background: #222; color: #fff; font-size: 16px; }
        button { padding: 12px 24px; border: none; background: #ff0000; color: white; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .video-player { margin-bottom: 20px; border-radius: 8px; overflow: hidden; background: #000; }
        .results { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .video-item { background: #1e1e1e; padding: 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 10px; transition: background 0.2s; }
        .video-item:hover { background: #2a2a2a; }
        .video-item img { width: 120px; height: 90px; object-fit: cover; border-radius: 4px; }
        .video-info { display: flex; flex-direction: column; justify-content: center; }
        .video-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; color: #ececec; }
    </style>
</head>
<body>
<div class="container">
    <div class="search-box">
        <input type="text" id="query" placeholder="Buscar videos en YouTube..." onkeyup="if(event.key === 'Enter') buscarVideos()">
        <button onclick="buscarVideos()">Buscar</button>
    </div>

    <div class="video-player">
        <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="dQw4w9WgXcQ"></div>
    </div>

    <div id="results" class="results"></div>
</div>

<script src="https://plyr.io"><\\/script>
<script>
    let player;
    
    // Esperar a que la librería Plyr cargue de forma nativa en la ventana limpia
    window.onload = function() {
        if (window.Plyr) {
            player = new Plyr('#player', { fullscreen: { enabled: true } });
        }
    };

    async function buscarVideos() {
        const query = document.getElementById('query').value;
        if (!query) return;

        const url = 'https://googleapis.com' + encodeURIComponent(query) + '&type=video&key=${API_KEY}';
        
        try {
            const response = await fetch(url);
            const data = await response.json();
            mostrarResultados(data.items);
        } catch (error) {
            console.error("Error en la API:", error);
        }
    }

    function mostrarResultados(items) {
        const container = document.getElementById('results');
        container.innerHTML = '';

        if(!items || items.length === 0) {
            container.innerHTML = '<p>No se encontraron resultados. Verifica tu API Key.</p>';
            return;
        }

        items.forEach(item => {
            const videoId = item.id.videoId;
            if (!videoId) return;
            const title = item.snippet.title;
            const thumb = item.snippet.thumbnails.medium.url;

            const itemHtml = \`
                <div class="video-item" onclick="reproducirVideo('\${videoId}')">
                    <img src="\${thumb}">
                    <div class="video-info">
                        <div class="video-title">\${title}</div>
                    </div>
                </div>
            \`;
            container.innerHTML += itemHtml;
        });
    }

    function reproducirVideo(id) {
        if(player) {
            player.source = {
                type: 'video',
                sources: [{ src: id, provider: 'youtube' }]
            };
            player.play();
        }
    }
<\/script>
</body>
</html>
        `;

        // Inyección limpia e independiente en la pestaña en blanco
        nuevaVentana.document.open();
        nuevaVentana.document.write(codigoCompleto);
        nuevaVentana.document.close();
    }
</script>
</body>
</html>
