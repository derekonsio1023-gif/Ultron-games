<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON 0.3 - Estable</title>
    <style>
        :root { --bg-color: #050508; --card-bg: #0d0f16; --border-color: #16192b; --neon-blue: #00d2ff; --neon-pink: #ff0055; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-color); font-family: 'Segoe UI', sans-serif; color: white; overflow-x: hidden; }
        
        /* HEADER ESTILO ORIGINAL */
        header { text-align: center; padding: 30px 20px 10px 20px; }
        h1 { margin: 0; font-size: 2.5rem; font-weight: 900; letter-spacing: 3px; color: var(--neon-blue); text-shadow: 0 0 20px rgba(0, 210, 255, 0.4); text-transform: uppercase; }
        .subtitle { color: #4b5275; font-size: 0.9rem; margin-top: 4px; letter-spacing: 2px; text-transform: uppercase; }

        /* CONTENEDORES */
        .main-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .section-title { font-size: 1.3rem; color: #fff; border-left: 4px solid var(--neon-pink); padding-left: 10px; margin: 30px 0 20px 0; text-transform: uppercase; letter-spacing: 1px; }

        /* TARJETAS ESTILO ORIGINAL */
        .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; border: 2px solid var(--border-color); display: flex; flex-direction: column; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); aspect-ratio: 2/3; position: relative; }
        .card:hover { transform: translateY(-5px); border-color: var(--neon-blue); box-shadow: 0 10px 30px rgba(0, 210, 255, 0.2); }
        .card-thumb { width: 100%; flex-grow: 1; background: linear-gradient(45deg, #0d0f16, #16192b); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-thumb span { font-size: 3rem; color: #1f243a; font-weight: bold; }
        .card-footer { padding: 12px; background: rgba(5, 5, 8, 0.9); border-top: 1px solid var(--border-color); text-align: center; }
        .card-title { font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-status { font-size: 0.7rem; color: var(--neon-blue); margin-top: 4px; text-transform: uppercase; opacity: 0.7; }

        /* PANTALLAS DE JUEGO Y CARGA */
        #menu-view { display: block; }
        #loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050508; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #game-runtime { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: none; }
        #game-frame { width: 100%; height: 100%; border: none; background: #000; }
        
        /* BOTÓN VOLVER REFORZADO */
        #back-btn { position: absolute; top: 20px; right: 20px; padding: 12px 24px; background: var(--neon-pink); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; z-index: 10001; text-transform: uppercase; box-shadow: 0 0 20px rgba(255, 0, 85, 0.4); }

        .spinner { width: 40px; height: 40px; border: 4px solid #111; border-top-color: var(--neon-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="menu-view">
        <header>
            <h1>Ultron</h1>
            <div class="subtitle">System Architecture 0.3</div>
        </header>
        <div class="main-container">
            <div class="section-title">Biblioteca Principal</div>
            <div class="grid" id="grid-estandar"></div>
            <div class="section-title">Slots de Expansión</div>
            <div class="grid" id="grid-personalizable"></div>
        </div>
    </div>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loader-msg">ESTABLECIENDO CONEXIÓN...</div>
    </div>

    <div id="game-runtime">
        <button id="back-btn" onclick="cerrarJuego()">Volver al Menú</button>
        <iframe id="game-frame"></iframe>
    </div>

    <script>
        // CONFIGURACIÓN DE URLS (GitHack para evitar errores)
        const CONFIG = {
            1: { titulo: "Backrooms", url: "https://raw.githack.com/derekonsio1023-gif/Fluffy-totus/main/backrooms.html" },
            2: { titulo: "Ball Survivor", url: "https://raw.githack.com/derekonsio1023-gif/Fluffy-totus/main/Ball_Survivor.html" }
        };

        const TOTAL_SLOTS = 24;
        let biblioteca = [];

        function inicializar() {
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                biblioteca.push({
                    id: i,
                    titulo: CONFIG[i] ? CONFIG[i].titulo : (i <= 12 ? "Próximamente" : "Disponible"),
                    url: CONFIG[i] ? CONFIG[i].url : "",
                    activo: !!CONFIG[i]
                });
            }
        }

        function renderizar() {
            const ge = document.getElementById('grid-estandar');
            const gp = document.getElementById('grid-personalizable');
            ge.innerHTML = gp.innerHTML = '';

            biblioteca.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `card ${!item.activo ? 'locked' : ''}`;
                if(item.activo) card.onclick = () => lanzarJuego(item.url);

                card.innerHTML = `
                    <div class="card-thumb">
                        ${item.activo ? '' : '<span>?</span>'}
                    </div>
                    <div class="card-footer">
                        <div class="card-title">${item.titulo}</div>
                        <div class="card-status">${item.activo ? 'Online' : 'Offline'}</div>
                    </div>`;
                
                (index < 12 ? ge : gp).appendChild(card);
            });
        }

        function lanzarJuego(url) {
            const runtime = document.getElementById('game-runtime');
            const frame = document.getElementById('game-frame');
            const loader = document.getElementById('loading-screen');

            // 1. Reset e inicio de carga
            frame.src = "about:blank";
            document.getElementById('menu-view').style.display = 'none';
            loader.style.display = 'flex';

            // 2. Cargar URL directa
            frame.src = url;

            // 3. Mostrar cuando esté listo
            frame.onload = () => {
                if(frame.src !== "about:blank") {
                    loader.style.display = 'none';
                    runtime.style.display = 'block';
                }
            };
        }

        function cerrarJuego() {
            // 1. Limpiar el frame
            document.getElementById('game-frame').src = "about:blank";
            // 2. Ocultar capas de juego
            document.getElementById('game-runtime').style.display = 'none';
            document.getElementById('loading-screen').style.display = 'none';
            // 3. Mostrar menú
            document.getElementById('menu-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        inicializar();
        renderizar();
    </script>
</body>
</html>
