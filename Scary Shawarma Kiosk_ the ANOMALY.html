<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scary Shawarma 3D</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#unity-canvas{
    width:100%;
    height:100%;
    display:block;
    background:#000;
}

#loading{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-family:Arial;
    font-size:28px;
    z-index:10;
}
</style>
</head>

<body>

<div id="loading">Loading...</div>

<canvas id="unity-canvas"></canvas>

<script>

/* =========================
   SAFE YANDEX STUB
========================= */

window.YaGames = {
    init: async () => ({
        adv: {
            showFullscreenAdv: () => {},
            showRewardedVideo: () => {}
        },

        getPlayer: async () => null,

        environment: {
            i18n: {
                lang: "en"
            }
        },

        deviceInfo: {
            type: "desktop",
            isMobile: () => false,
            isDesktop: () => true
        }
    })
};

/* =========================
   UNITY SAFE SENDMESSAGE
========================= */

window.unitySafeSend = function(instance, obj, method, param){

    const blocked = [
        "Adv",
        "Reward",
        "Fullscreen",
        "Metrica",
        "Advertisement",
        "Yandex",
        "реклама"
    ];

    const combined =
        String(method || "") + " " +
        String(param || "");

    for(const word of blocked){
        if(combined.includes(word)){
            console.log("Blocked:", combined);
            return;
        }
    }

    try{
        if(param !== undefined)
            instance.SendMessage(obj, method, param);
        else
            instance.SendMessage(obj, method);
    }
    catch(e){
        console.warn("SendMessage Error:", e);
    }
};

/* =========================
   CONFIG
========================= */

const hash =
"2d3cf8131a7cd9525c77b35f421c7100c2682d65";

const base =
"https://cdn.jsdelivr.net/gh/shayderrr/idk@" +
hash +
"/scary/";

const loading =
document.getElementById("loading");

let unityInstance = null;

/* =========================
   LOADER
========================= */

function loadScript(url){
    return new Promise((resolve,reject)=>{

        const s = document.createElement("script");

        s.src = url;

        s.onload = resolve;

        s.onerror = reject;

        document.head.appendChild(s);
    });
}

/* =========================
   START
========================= */

(async()=>{

try{

    // NO YANDEX SDK

    // Unity Loader
    await loadScript(
        base + "Build/Builds.loader.js"
    );

    createUnityInstance(
        document.querySelector("#unity-canvas"),
        {

            dataUrl:
                base + "Build/Builds.data.br",

            frameworkUrl:
                base + "Build/Builds.framework.js.br",

            codeUrl:
                base + "Build/Builds.wasm.br.part1",

            streamingAssetsUrl:
                base + "StreamingAssets",

            companyName:
                "DefaultCompany",

            productName:
                "ScaryShawarma3D",

            productVersion:
                "1.0"

        }

    ).then(instance=>{

        unityInstance = instance;

        loading.remove();

        console.log(
            "Unity Loaded Successfully"
        );

    }).catch(err=>{

        console.error(err);

        loading.innerText =
            "Unity Load Error";

    });

}catch(e){

    console.error(e);

    loading.innerText =
        "Fatal Error";

}

})();

/* =========================
   REMOVE RUSSIAN TEXT
========================= */

const observer =
new MutationObserver(()=>{

    document
    .querySelectorAll("div,span,p")
    .forEach(el=>{

        if(
            el.textContent &&
            (
                el.textContent.includes("реклама") ||
                el.textContent.includes("будет доступна")
            )
        ){
            el.remove();
        }

    });

});

observer.observe(document.body,{
    childList:true,
    subtree:true
});

</script>

</body>
</html>
