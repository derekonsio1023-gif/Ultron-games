<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRON 0.3 - Rainbow Edition</title>
    <style>
        :root { 
            --bg-color: #050508; 
            --card-bg: #0d0f16; 
            --border-color: #16192b; 
            --neon-blue: #00d2ff; 
            --neon-pink: #ff0055; 
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', sans-serif; color: white; 
            overflow-x: hidden; 
        }
        
        header { text-align: center; padding: 40px 20px; }
        h1 { 
            margin: 0; font-size: 3rem; font-weight: 900; letter-spacing: 5px; 
            color: var(--neon-blue); text-shadow: 0 0 20px rgba(0, 210, 255, 0.5); 
            text-transform: uppercase; 
        }
        
        /* BARRA DE BÚSQUEDA FUTURISTA */
        .search-container {
            max-width: 600px; margin: 0 auto 30px; position: relative;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            border: 2px solid var(--neon-blue);
            border-radius: 10px;
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.05), rgba(255, 0, 85, 0.05));
            overflow: hidden;
            box-shadow: 
                0 0 20px rgba(0, 210, 255, 0.3),
                inset 0 0 20px rgba(0, 210, 255, 0.1),
                0 0 40px rgba(255, 0, 85, 0.2);
            transition: all 0.3s ease;
        }

        .search-wrapper:hover,
        .search-wrapper:focus-within {
            border-color: var(--neon-pink);
            box-shadow: 
                0 0 30px rgba(255, 0, 85, 0.5),
                inset 0 0 20px rgba(255, 0, 85, 0.1),
                0 0 50px rgba(0, 210, 255, 0.2);
        }

        .search-icon {
            padding: 0 15px;
            color: var(--neon-blue);
            font-size: 1.2rem;
            transition: color 0.3s ease;
        }

        .search-wrapper:focus-within .search-icon {
            color: var(--neon-pink);
        }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 15px 10px;
            font-size: 1rem;
            outline: none;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #search-input::placeholder {
            color: rgba(0, 210, 255, 0.5);
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--neon-pink);
            padding: 0 15px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: none;
        }

        .clear-btn.visible {
            display: block;
        }

        .clear-btn:hover {
            color: var(--neon-blue);
            transform: rotate(90deg);
        }

        .search-status {
            text-align: center;
            color: var(--neon-blue);
            font-size: 0.85rem;
            margin-top: 10px;
            letter-spacing: 2px;
            display: none;
        }

        .search-status.active {
            display: block;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--neon-pink);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .main-container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        .section-title { 
            font-size: 1.4rem; color: #fff; border-left: 5px solid var(--neon-pink); 
            padding-left: 15px; margin: 40px 0 20px 0; text-transform: uppercase; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; 
        }

        /* DISEÑO DE TARJETA */
        .card { 
            background: var(--card-bg); border-radius: 12px; overflow: hidden; 
            border: 2px solid var(--border-color); display: flex; 
            flex-direction: column; cursor: pointer; 
            transition: all 0.3s ease; aspect-ratio: 2/3; 
        }
        .card:hover { 
            transform: translateY(-10px); border-color: var(--neon-blue); 
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3); 
        }
        
        /* PORTADA (ARRIBA) */
        .card-thumb { 
            width: 100%; height: 75%; 
            background-size: cover; background-position: center; 
            background-color: #0a0c12; display: flex; 
            align-items: center; justify-: center; 
            border-bottom: 2px solid var(--border-color);
        }

        .empty-icon { 
            font-size: 5rem; font-weight: 900; color: #1f243a; 
            user-select: none; 
        }

        /* TÍTULO (ABAJO) */
        .card-footer { 
            height: 25%; display: flex; flex-direction: column; 
            justify-: center; align-items: center; padding: 5px 10px;
            background: linear-gradient(to bottom, #0d0f16, #050508);
        }
        .card-title { 
            font-size: 0.9rem; font-weight: 800; text-align: center; 
            text-transform: uppercase; color: #fff; width: 100%; 
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
        }
        .card-status { font-size: 0.65rem; color: var(--neon-blue); margin-top: 4px; font-weight: bold; }

        /* PANTALLA DE CARGA MEJORADA */
        #loading-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 10000; display: none; 
            flex-direction: column; align-items: center; justify-: center; 
        }

        .progress-container {
            width: 80%; max-width: 400px; height: 12px;
            background: #11131c; border-radius: 20px;
            margin-top: 30px; border: 1px solid #16192b;
            overflow: hidden;
        }

        #progress-bar {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 200% 100%;
            animation: rainbow-scroll 2s linear infinite;
            transition: width 0.3s ease;
        }

        .loading-info {
            margin-top: 15px; font-family: monospace; 
            color: var(--neon-blue); font-size: 0.8rem;
            letter-spacing: 2px;
        }

        @keyframes rainbow-scroll {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* RUNTIME JUEGO */
        #game-runtime { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9998; display: none; }
        #game-frame { width: 100%; height: 100%; border: none; }
        #back-btn { 
            position: fixed; bottom: 25px; right: 25px; z-index: 9999; 
            padding: 12px 25px; background: var(--neon-pink); color: white; 
            border: none; border-radius: 5px; cursor: pointer; font-weight: bold; 
            text-transform: uppercase; box-shadow: 0 0 15px var(--neon-pink); 
        }

        .spinner { 
            width: 50px; height: 50px; border: 5px solid #111; 
            border-top-color: var(--neon-blue); border-radius: 50%; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .search-container {
                padding: 0 20px;
            }

            #search-input {
                font-size: 0.9rem;
                padding: 12px 8px;
            }
        }
    </style>
</head>

        const TOTAL_SLOTS = 100;
        let allCards = [];

        function generarMenu() {
            const grid = document.getElementById('main-grid');
            for (let i = 1; i <= TOTAL_SLOTS; i++) {
                const j = CONFIG[i];
                const card = document.createElement('div');
                card.className = 'card';
                card.setAttribute('data-search', `${j ? j.titulo : "Próximamente"}`.toLowerCase());
                card.setAttribute('data-index', i);
                
                const tieneImagen = j && j.img && j.img !== "";
                const bgStyle = tieneImagen ? `background-image: url('${j.img}')` : "";
                const titulo = j ? j.titulo : "Próximamente";

                card.innerHTML = `
                    <div class="card-thumb" style="${bgStyle}">
                        ${tieneImagen ? '' : '<span class="empty-icon">?</span>'}
                    </div>
                    <div class="card-footer">
                        <div class="card-title">${titulo}</div>
                        <div class="card-status">${j ? 'ONLINE' : 'OFFLINE'}</div>
                    </div>
                `;

                if (j && j.url) {
                    card.onclick = () => lanzarJuego(j.url);
                }
                grid.appendChild(card);
                allCards.push(card);
            }
        }

        function buscarJuegos() {
            const searchInput = document.getElementById('search-input').value.toLowerCase();
            const noResults = document.getElementById('no-results');
            const searchStatus = document.getElementById('search-status');
            const clearBtn = document.getElementById('clear-btn');
            let coincidencias = 0;

            // Mostrar/ocultar botón de limpiar
            if (searchInput.length > 0) {
                clearBtn.classList.add('visible');
            } else {
                clearBtn.classList.remove('visible');
                searchStatus.classList.remove('active');
                noResults.style.display = 'none';
                allCards.forEach(card => card.style.display = '');
                return;
            }

            allCards.forEach(card => {
                const gameTitle = card.getAttribute('data-search');
                if (gameTitle.includes(searchInput)) {
                    card.style.display = '';
                    coincidencias++;
                } else {
                    card.style.display = 'none';
                }
            });

            if (coincidencias === 0) {
                noResults.style.display = 'block';
                searchStatus.classList.remove('active');
            } else {
                noResults.style.display = 'none';
                searchStatus.classList.add('active');
                searchStatus.innerText = `${coincidencias} RESULTADO${coincidencias !== 1 ? 'S' : ''} ENCONTRADO${coincidencias !== 1 ? 'S' : ''}`;
            }
        }

        function limpiarBusqueda() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-btn').classList.remove('visible');
            document.getElementById('search-status').classList.remove('active');
            document.getElementById('no-results').style.display = 'none';
            allCards.forEach(card => card.style.display = '');
            document.getElementById('search-input').focus();
        }

        function lanzarJuego(url) {
            const menu = document.getElementById('menu-view');
            const loader = document.getElementById('loading-screen');
            const runtime = document.getElementById('game-runtime');
            const frame = document.getElementById('game-frame');
            const progressBar = document.getElementById('progress-bar');
            const loadingStats = document.getElementById('loading-stats');

            menu.style.display = 'none';
            loader.style.display = 'flex';
            
            // Reset de barra
            let progreso = 0;
            progressBar.style.width = '0%';
            frame.src = "about:blank";

            // Simulación de carga (ideal para archivos de 47MB)
            const intervalo = setInterval(() => {
                if (progreso < 92) {
                    progreso += Math.random() * 2;
                    if (progreso > 92) progreso = 92;
                    progressBar.style.width = progreso + '%';
                    loadingStats.innerText = `DESCOMPRIMIENDO: ${Math.round(progreso)}%`;
                }
            }, 350);

            frame.src = url;

            frame.onload = () => {
                if(frame.src !== "about:blank") {
                    clearInterval(intervalo);
                    progressBar.style.width = '100%';
                    loadingStats.innerText = "¡SISTEMA LISTO!";
                    
                    setTimeout(() => {
                        loader.style.display = 'none';
                        runtime.style.display = 'block';
                    }, 1000);
                }
            };
        }

        function cerrarJuego() {
            document.getElementById('game-runtime').style.display = 'none';
            document.getElementById('game-frame').src = "about:blank";
            document.getElementById('menu-view').style.display = 'block';
            window.scrollTo(0,0);
        }

        // Event listeners para búsqueda
        document.getElementById('search-input').addEventListener('input', buscarJuegos);
        document.getElementById('clear-btn').addEventListener('click', limpiarBusqueda);

        // Enter para buscar
        document.getElementById('search-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                buscarJuegos();
            }
        });

        window.onload = generarMenu;
    </script>
